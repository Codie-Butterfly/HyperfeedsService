services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: hyperfeeds
      POSTGRES_USER: hyperfeeds
      POSTGRES_PASSWORD: hyperfeeds
    ports:
      - "5432:5432"
    volumes:
      - hyperfeeds-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hyperfeeds -d hyperfeeds"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  hyperfeeds-postgres:
