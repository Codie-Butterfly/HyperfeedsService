name: Build and deploy Hyperfeeds Service

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: hyperfeeds-production
  cancel-in-progress: false

permissions:
  contents: read

env:
  IMAGE_NAME: ${{ secrets.DOCKER_USERNAME }}/hyperfeeds-service

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.image.outputs.value }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Test backend
        run: ./mvnw --batch-mode test

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and publish image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
            ${{ env.IMAGE_NAME }}:latest

      - id: image
        run: echo "value=${IMAGE_NAME}:${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Install SSH deployment client
        run: sudo apt-get update && sudo apt-get install -y sshpass

      - name: Upload production Compose file
        env:
          SERVER_IP: ${{ secrets.SERVER_IP }}
          SCP_USERNAME: ${{ secrets.SCP_USERNAME }}
          SCP_PASSWORD: ${{ secrets.SCP_PASSWORD }}
        run: sshpass -p "$SCP_PASSWORD" scp -o StrictHostKeyChecking=no compose.production.yaml "${SCP_USERNAME}@${SERVER_IP}:/tmp/hyperfeeds-compose.yaml"

      - name: Deploy immutable image
        env:
          SERVER_IP: ${{ secrets.SERVER_IP }}
          SCP_USERNAME: ${{ secrets.SCP_USERNAME }}
          SCP_PASSWORD: ${{ secrets.SCP_PASSWORD }}
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
          IMAGE: ${{ needs.build.outputs.image }}
        run: |
          printf '%s' "$DOCKER_PASSWORD" | sshpass -p "$SCP_PASSWORD" ssh -o StrictHostKeyChecking=no "${SCP_USERNAME}@${SERVER_IP}" \
            "sudo docker login -u '${DOCKER_USERNAME}' --password-stdin"
          sshpass -p "$SCP_PASSWORD" ssh -o StrictHostKeyChecking=no "${SCP_USERNAME}@${SERVER_IP}" "\
            sudo mkdir -p /opt/hyperfeeds && \
            sudo mv /tmp/hyperfeeds-compose.yaml /opt/hyperfeeds/compose.yaml && \
            cd /opt/hyperfeeds && \
            sudo HYPERFEEDS_IMAGE='${IMAGE}' docker compose --env-file .env pull api && \
            sudo HYPERFEEDS_IMAGE='${IMAGE}' docker compose --env-file .env up -d --remove-orphans && \
            sudo docker image prune -f"

      - name: Verify deployment
        env:
          SERVER_IP: ${{ secrets.SERVER_IP }}
        run: |
          for attempt in {1..18}; do
            if curl --fail --silent "http://${SERVER_IP}:8081/api/actuator/health"; then
              exit 0
            fi
            sleep 10
          done
          exit 1
